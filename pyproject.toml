[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "productspy"
version = "0.4.0"
description = "Extract product name, price and availability from shopping sites."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Renqwee" }]
keywords = ["scraping", "price-tracking", "ecommerce", "amazon", "noon", "carrefour", "jarir"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]
[project.urls]
Homepage = "https://github.com/Renqwee/productspy"
Issues = "https://github.com/Renqwee/productspy/issues"

[tool.hatch.build.targets.wheel]
packages = ["productspy"]

[tool.hatch.build.targets.sdist]
# An allowlist, not an exclude list. A denylist ships whatever nobody
# thought to name: 0.4.0 went out carrying local editor state that no
# exclude rule covered, because hatchling reads this repo's .gitignore
# alone and knows nothing about a machine-level ignore file. Naming what
# belongs in the sdist means anything new in the tree stays out by default.
include = [
    "productspy/",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]